# The CI gate, per ADR-0200. It runs `mise run ci`, the same command as the pre-push hook.

name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://app:local-test@127.0.0.1:5433/app_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ci
