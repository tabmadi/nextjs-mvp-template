# Markdown ruleset for `mise run lint:md`, lefthook, and any editor with the rumdl
# LSP. rumdl is the single source of truth for Markdown lint and format.
# Rules: https://github.com/rvben/rumdl

[global]
# Prose is not hard-wrapped: one line per paragraph, list item, or table row, so a
# reflow never shows up as a diff. A column limit would fight that (ADR-0001).
disable = ["MD013"]
exclude = ["node_modules", ".next", "**/CHANGELOG.md"]

[MD004]
style = "dash"

[MD007]
indent = 2
style = "fixed"

# ADRs reuse section names (Context, Decision, Consequences) under different parents.
[MD024]
siblings-only = true

[MD029]
style = "ordered"

# Tables are compact, never column-padded: one space inside each pipe and a bare
# `---` delimiter. Padding makes every cell edit reflow the whole table.
[MD060]
enabled = true
style = "compact"
