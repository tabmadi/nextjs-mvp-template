# Git hooks, per ADR-0100. `mise run setup` installs them.

commit-msg:
  commands:
    cog:
      run: cog verify --ignore-merge-commits --file {1}

pre-commit:
  # Keep this in step with the `lint` task in .mise.toml. A check that only CI runs lets a commit pass locally.
  piped: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,tsx}"
      run: bun run tsc --noEmit
    markdown:
      glob: "*.md"
      run: rumdl check {staged_files}
    secrets:
      run: gitleaks protect --staged --no-banner
