# Git hooks, per ADR-0100. `mise run setup` installs them.
# Every command runs through `mise x` because a git hook has no active mise shell.

commit-msg:
  commands:
    cog:
      run: mise x -- cog verify --ignore-merge-commits --file {1}

pre-commit:
  piped: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: mise x -- biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,tsx}"
      run: mise x -- bun run next typegen && mise x -- bun run tsc --noEmit
    test:
      glob: "*.{ts,tsx}"
      run: mise run test
    markdown:
      glob: "*.md"
      run: mise x -- rumdl check {staged_files}
    secrets:
      run: mise x -- gitleaks protect --staged --no-banner

# The full CI run, so a push never reaches CI untested. `git push --no-verify` skips it.
pre-push:
  commands:
    ci:
      run: mise run ci
