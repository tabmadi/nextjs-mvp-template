# The secret scan of ADR-0100. It extends the default gitleaks rule set and does not replace it.

title = "mvp secret scan"

[extend]
useDefault = true

[allowlist]
description = """
Build output and dependency trees that git ignores, and the lockfile, which
holds integrity hashes. An entry for any other path hides the defect that this
scan looks for.
"""

paths = [
  '''^\.next/''',
  '''^node_modules/''',
  '''.*/node_modules/''',
  '''^bun\.lock$''',
]
