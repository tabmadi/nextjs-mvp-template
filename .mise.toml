# Every tool that the repo needs is pinned here, per ADR-0100.

[tools]
bun = "1.3.14"
node = "24.21.0"
biome = "2.5.0"
dbmate = "2.33.0"
lefthook = "2.1.9"
cocogitto = "7.0.0"
rumdl = "0.2.18"
gitleaks = "8.30.1"
docker-cli = "29.8.0"
"aqua:docker/compose" = "5.5.1"

[env]
_.file = ".env"
# dbmate dumps the schema with pg_dump after each migration. The migrations are the authority, per ADR-0300.
DBMATE_NO_DUMP_SCHEMA = "true"

[tasks.install]
description = "Install the locked dependencies"
run = "bun install --frozen-lockfile"

[tasks.setup]
description = "Install dependencies and git hooks"
depends = ["install"]
run = "lefthook install"

[tasks.dev]
description = "Run the app against the local database"
run = "bun run next dev"

[tasks.build]
description = "Production build, as standalone output"
run = [
  "bun run next build",
  "cp -r .next/static .next/standalone/.next/static",
  "if [ -d public ]; then cp -r public .next/standalone/public; fi",
]

[tasks.start]
description = "Serve the production build"
env = { NODE_ENV = "production" }
run = "node .next/standalone/server.js"

[tasks."db:up"]
description = "Start the local PostgreSQL"
run = "docker-compose up --wait postgres"

[tasks."db:down"]
description = "Stop the local PostgreSQL and keep its data"
run = "docker-compose stop postgres"

[tasks."docker:build"]
description = "Build the production image"
run = "docker-compose build app"

[tasks."docker:up"]
description = "Run the production image against the local PostgreSQL"
run = "docker-compose up --build --wait app"

[tasks."db:migrate"]
description = "Apply pending migrations"
run = "dbmate up"

[tasks."db:new"]
description = "Create a migration: mise run db:new <name>"
run = "dbmate new"

[tasks.test]
description = "Run the unit tests"
run = "bun test src"

[tasks."db:test:up"]
description = "Start the disposable test PostgreSQL"
run = "docker-compose --profile test up --wait postgres-test"

[tasks."db:test:migrate"]
description = "Apply the migrations to TEST_DATABASE_URL"
run = "dbmate --env TEST_DATABASE_URL up"

[tasks."test:db"]
description = "Run the database tests against TEST_DATABASE_URL"
run = "bun --conditions=react-server test --preload ./tests/setup.database.ts tests/integration"

[tasks."lint:ts"]
description = "Biome and the TypeScript compiler"
run = ["bun run next typegen", "biome check .", "bun run tsc --noEmit"]

[tasks."lint:md"]
description = "Markdown structure and formatting, per ADR-0001"
run = "rumdl check ."

[tasks."lint:secrets"]
description = "Scan the working tree for committed secrets"
run = "gitleaks dir . --no-banner"

[tasks.lint]
description = "Every linter"
depends = ["lint:ts", "lint:md", "lint:secrets"]

[tasks.format]
description = "Apply every formatter"
run = "biome check . --write"

[tasks.check]
description = "The gate: run it before you finish a change"
depends = ["lint", "test", "build"]
